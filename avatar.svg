<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="おしゃれミニマルなフラットアバター">
  <!-- くすみカラーのやさしい背景 -->
  <rect width="512" height="512" fill="#e9e1d6"/>
  <circle cx="256" cy="244" r="196" fill="#ded2c1"/>

  <!-- ジャケット（くすみグレー・面で構成、輪郭線なし） -->
  <path d="M126 512 C126 432 176 392 214 380 L298 380 C336 392 386 432 386 512 Z" fill="#969ca0"/>
  <!-- 片側の陰影でさりげない立体感 -->
  <path d="M256 384 L298 380 C336 392 386 432 386 512 L300 512 Z" fill="#878d92"/>
  <!-- ネイビーのインナー -->
  <path d="M236 384 L256 452 L276 384 C268 398 244 398 236 384 Z" fill="#2b3a55"/>
  <!-- ジャケットの襟 -->
  <path d="M214 380 L256 452 L238 386 Z" fill="#aab0b3"/>
  <path d="M298 380 L256 452 L274 386 Z" fill="#9aa0a4"/>

  <!-- 首 -->
  <path d="M232 326 L232 392 C246 406 266 406 280 392 L280 326 Z" fill="#e0aa81"/>
  <!-- 首の陰 -->
  <path d="M232 326 C232 350 280 350 280 326 L280 340 C280 360 232 360 232 340 Z" fill="#d49d72"/>

  <!-- 顔（やや斜め・丸みのある面） -->
  <path d="M256 132 C312 132 328 176 328 222 C328 286 300 330 256 330 C212 330 184 286 184 222 C184 176 200 132 256 132 Z" fill="#edc09a"/>
  <!-- 3/4のさりげない陰（右側） -->
  <path d="M256 132 C312 132 328 176 328 222 C328 286 300 330 256 330 C292 322 308 282 308 222 C308 178 294 144 256 132 Z" fill="#e3b187"/>
  <!-- 耳 -->
  <circle cx="186" cy="232" r="15" fill="#e3b288"/>
  <circle cx="326" cy="232" r="15" fill="#dca983"/>

  <!-- 黒髪・短髪を自然に流したスタイル（面で表現） -->
  <path d="M182 236
           C160 150 206 100 262 100
           C322 100 350 150 332 234
           C330 206 318 192 302 192
           C306 168 296 150 276 148
           C292 168 290 196 282 210
           C280 184 270 172 252 172
           C242 196 218 210 196 214
           C192 224 186 230 182 236 Z"
        fill="#2b2723"/>
  <!-- 前髪の流れ（ハイライト面） -->
  <path d="M196 214 C214 184 248 168 276 148 C260 176 236 196 208 218 Z" fill="#3a342f"/>

  <!-- 透明フレームのメガネ（細い線・うっすら反射） -->
  <g fill="#ffffff" fill-opacity="0.16" stroke="#9c8d76" stroke-width="3.2">
    <path d="M204 228 q22 -6 44 0 q4 26 -6 36 q-16 8 -32 0 q-10 -16 -6 -36 Z"/>
    <path d="M264 228 q22 -6 44 0 q4 20 -6 36 q-16 8 -32 0 q-10 -10 -6 -36 Z"/>
  </g>
  <g fill="none" stroke="#9c8d76" stroke-width="3" stroke-linecap="round">
    <path d="M248 232 q8 -4 16 0"/>
    <path d="M204 230 L186 226"/>
    <path d="M308 230 L326 226"/>
  </g>

  <!-- 表情（最小限の線・明るい笑顔） -->
  <g fill="none" stroke="#3a322c" stroke-width="3.4" stroke-linecap="round">
    <!-- 眉 -->
    <path d="M210 212 q14 -7 30 -2"/>
    <path d="M272 210 q16 -5 30 2"/>
    <!-- 笑った目 -->
    <path d="M214 244 q12 -10 26 0"/>
    <path d="M272 244 q12 -10 26 0"/>
    <!-- 鼻 -->
    <path d="M256 256 l-5 18 q5 4 10 0"/>
  </g>
  <!-- 口（明るい笑顔） -->
  <path d="M228 286 q28 26 56 0 q-28 14 -56 0 Z" fill="#ffffff"/>
  <path d="M228 286 q28 22 56 0" fill="none" stroke="#3a322c" stroke-width="3.4" stroke-linecap="round"/>
  <!-- ほんのり頬 -->
  <circle cx="212" cy="268" r="10" fill="#e9a87f" fill-opacity="0.5"/>
  <circle cx="300" cy="268" r="10" fill="#e09c70" fill-opacity="0.5"/>
</svg>
